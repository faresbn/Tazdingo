name: Validate and publish Forever Ledger

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"  # about every two hours: refresh Blizzard's posts and the launch countdown

permissions:
  contents: read

concurrency:
  group: fvrrepo-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # the site's change log is built from git history
      - name: Test parser and original captures
        run: python3 -m unittest discover -s tests -v
      - name: Check browser script syntax
        run: node --check site/assets/app.js
      - name: Refresh Blizzard's Forever posts (keeps the saved ones if the forums can't be read)
        if: github.event_name != 'pull_request'
        run: python3 scripts/blue_posts.py
      - name: Generate public site and records
        run: python3 scripts/build.py --base-path /FvrRepo/
      - name: Verify public output
        run: python3 scripts/check_site.py
      - name: Upload public artefact only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artefact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
