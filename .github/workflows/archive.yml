name: Archive page changes

# After any push to main that changes a page in content/, save the previous version of each
# changed page to archive/ and log the change in archive/LOG.md. The archive is private (it's
# never part of the published site). This commit is made with the workflow's own token, which
# doesn't start other workflows, so it can't loop or republish the site.

on:
  push:
    branches: [main]
    paths: ["content/**"]

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main  # current main, not the pushed commit: an earlier run may have recorded since
          fetch-depth: 0
      - name: Record changes, back up previous versions and commit
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git config user.name "tazdingo-archive[bot]"
          git config user.email "tazdingo-archive@users.noreply.github.com"
          for attempt in 1 2 3; do
            python3 scripts/archive.py --before "$BEFORE" --after HEAD
            git add archive
            if git diff --cached --quiet; then echo "Nothing to record."; exit 0; fi
            git commit -q -m "Archive page changes up to $(git rev-parse --short HEAD)"
            if git push -q origin HEAD:main; then exit 0; fi
            # Someone pushed meanwhile: start again from the new main, so the record covers it too.
            git fetch -q origin main && git reset -q --hard origin/main
          done
          echo "Could not push the archive record after three attempts." >&2
          exit 1
